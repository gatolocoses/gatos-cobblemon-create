plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }

    runs {
        client {
            client()
            if (project.hasProperty('quickPlayServer')) {
                programArguments.addAll '--quickPlayMultiplayer', project.quickPlayServer
            }
            if (project.hasProperty('smokeTest')) {
                systemProperty 'gatos_recipe_share.smokeTest', 'true'
            }
        }

        server {
            server()
            programArgument '--nogui'
            programArguments.addAll '--port', '25566'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "dev.emi:emi-neoforge:${emi_version}"
    localRuntime "dev.emi:emi-neoforge:${emi_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
    exclude 'com/gatolocoses/recipeshare/ClientSmokeTest.class'
    from('LICENSE') {
        into 'META-INF'
    }
}

tasks.register('installPackJar', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar')
    into layout.projectDirectory.dir('../../mods')
}
